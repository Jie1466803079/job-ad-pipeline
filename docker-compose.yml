services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobpipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpipe}
      POSTGRES_DB: jobpipe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpipe -d jobpipe"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
