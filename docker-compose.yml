services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobpipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpipe}
      POSTGRES_DB: jobpipe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpipe -d jobpipe"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobpipe:${POSTGRES_PASSWORD:-jobpipe}@db:5432/jobpipe
      CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      db:
        condition: service_healthy

  # Catches every email n8n sends. Read them at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      TZ: Australia/Sydney
    ports:
      - "127.0.0.1:8025:8025"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.5
    restart: unless-stopped
    # Listed one by one and never env_file: workflows can read this environment with $env, so it must
    # hold no API keys. The API key and webhook secret live in n8n's encrypted credentials instead.
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: jobpipe
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-jobpipe}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is not set. Run make env.}
      GENERIC_TIMEZONE: Australia/Sydney
      TZ: Australia/Sydney
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      # The workflows read the addresses below with $env, which n8n 2.x blocks by default.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      MAIL_FROM: ${MAIL_FROM:-jobpipe@localhost}
      DIGEST_TO: ${DIGEST_TO:-jobpipe@localhost}
      ALERT_TO: ${ALERT_TO:-jobpipe@localhost}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/opt/n8n-import/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  n8n_data:
