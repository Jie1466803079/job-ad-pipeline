services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobpipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpipe}
      POSTGRES_DB: jobpipe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpipe -d jobpipe"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobpipe:${POSTGRES_PASSWORD:-jobpipe}@db:5432/jobpipe
      CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
