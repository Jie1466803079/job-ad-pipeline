[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpipe"
version = "0.1.0"
description = "Collect job ads from public job-board APIs, extract and check the key facts, and route each ad"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "psycopg[binary]>=3.3",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.15",
    "python-dateutil>=2.9",
    "httpx>=0.28",
    "tzdata>=2024.1",
    "google-genai>=2.28",
    "anthropic>=1.11",
    "argon2-cffi>=25.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["jobpipe*"]

[tool.setuptools.package-data]
"jobpipe.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
# Pyflakes, the core pycodestyle errors, import sorting and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]
